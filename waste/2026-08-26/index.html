<script>
const D=JSON.parse(document.getElementById('d').textContent);
const dec=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='blk_v1';
async function open_(raw){
  if(document.readyState!=='complete') await new Promise(r=>addEventListener('load',r));
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(D.iv)},k,dec(D.ct));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:dec(D.pw.salt),iterations:D.pw.iter,hash:'SHA-256'},base,256);
  const kek=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(D.pw.iv)},kek,dec(D.pw.wrapped));
  sessionStorage.setItem(KEY,btoa(String.fromCharCode(...new Uint8Array(raw))));
  return raw;
}
(async()=>{
  const cached=sessionStorage.getItem(KEY);
  if(cached){ try{ await open_(dec(cached).buffer); return; }catch(e){ sessionStorage.removeItem(KEY); } }
  const b=document.getElementById('b'),p=document.getElementById('p'),m=document.getElementById('m');
  const go=async()=>{ b.disabled=true;m.textContent='여는 중…';
    try{ await open_(await unlock(p.value)); }
    catch(e){ m.textContent='암호가 맞지 않습니다.';b.disabled=false;p.value='';p.focus(); } };
  b.onclick=go; p.onkeydown=e=>{if(e.key==='Enter')go()};
})();
</script></body></html>
